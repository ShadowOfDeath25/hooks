services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      .env
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm install && npx nodemon --watch src index.js"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-receiver:
    build: .
    command: npm run mock:dev
    environment:
      MOCK_PORT: "${MOCK_PORT:-4000}"
      MOCK_TIMEOUT_MS: "${MOCK_TIMEOUT_MS:-10000}"
      MOCK_WEBHOOK_SECRET: "${MOCK_WEBHOOK_SECRET}"
    ports:
      - "127.0.0.1:${MOCK_PORT:-4000}:${MOCK_PORT:-4000}"
    volumes:
      - .:/app
      - /app/node_modules
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  app_node_modules:
