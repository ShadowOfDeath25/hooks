services:
  app:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: npx nodemon -L index.js

  mock-server:
    build:
      target: dev
    command: npm run mock:dev
    environment:
      MOCK_PORT: "${MOCK_PORT:-4000}"
      MOCK_TIMEOUT_MS: "${MOCK_TIMEOUT_MS:-10000}"
      MOCK_SECRETS_PATH: "${MOCK_SECRETS_PATH:-./mock/secrets.json}"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
  # mock-server:
  #   build:
  #     target: dev

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
